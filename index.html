<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      text-align: center;
      padding: 100px 20px;
    }

    .card {
      background: white;
      padding: 40px 20px;
      border-radius: 15px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 4px 15px #00000015;
    }

    h1 {
      color: #2563eb;
    }

    p {
      color: #555;
      line-height: 1.6;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Welcome to My Website!</h1>
    <p>This is my first website hosted on AWS.</p>
    <button onclick="alert('My website is working!')">
      Click Me
    </button>
  </div>
</body>
</html>
